<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Livraria{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <div class="conteudo">
      <a class="marca" href="{{ url_for('livros.buscar') }}">Livraria</a>
      <nav>
        <a href="{{ url_for('livros.buscar') }}">Buscar livros</a>
        <a href="{{ url_for('lojas.listar') }}">Lojas</a>
      </nav>
    </div>
  </header>
  <main class="conteudo">
    {% for mensagem in get_flashed_messages() %}
      <p class="aviso" role="status">{{ mensagem }}</p>
    {% endfor %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
